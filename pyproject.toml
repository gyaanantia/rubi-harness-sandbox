[project]
name = "rubi-harness-sandbox"
version = "0.1.0"
description = "A small agent harness for exploring human decisions across runs"
requires-python = ">=3.12,<3.13"
dependencies = [
  "langchain==1.2.14",
  "langchain-core==1.6.1",
  "langgraph==1.1.4",
  "langgraph-checkpoint==3.0.1",
  "langgraph-prebuilt==1.0.8",
  "langgraph-sdk==0.3.1",
  "langsmith==0.6.1",
  "langchain-openai==1.1.7",
  "python-dotenv>=1.1,<2",
  "pyyaml>=6,<7",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12"]

[project.scripts]
sandbox = "cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness", "seed", "scenarios", "eval"]

[tool.hatch.build.targets.wheel.force-include]
"cli.py" = "cli.py"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["baseline: documents the initial learning gap; replace when implementing the loop"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
