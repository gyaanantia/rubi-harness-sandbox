name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Harness regression tests
        run: uv run pytest -q
      - run: uv run python -m eval.replay day1_screen --n 5 --fake
      - run: uv run python -m eval.replay unattended --n 5 --fake
      - run: uv run python -m eval.replay sync_failure --n 5 --fake
      - name: Verify the answered question is not asked again
        run: uv run python -m eval.replay day2_repeat --n 5 --fake
      - name: Verify a remembered decision needs no second ask
        run: uv run python -m eval.replay day2_remember --n 5 --fake
